version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DB_TYPE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=scraper
      - MYSQL_PASSWORD=scraper_pass
      - MYSQL_DB=scraper_db
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_pw
      - MYSQL_DATABASE=scraper_db
      - MYSQL_USER=scraper
      - MYSQL_PASSWORD=scraper_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiYTZiMjAxZjc1ZTVhOThjYTFiM2ZiNjM4N2RhMjQ0OGUiLCJ0IjoiMzBiYzAzYWMtY2ZhMS00NWJmLTg2ZGUtZDNiYjJhZTEzNjM5IiwicyI6Ik9HRm1NVGhrTURjdFlqUmxNUzAwWVRFMExUZzRZVE10T1RRM04yVTFZVGN5WkRNdyJ9
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql_data:

