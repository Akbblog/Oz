name: business_scraper_app
description: Infinity Leads Pro - Global business lead discovery platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.1
  csv: ^6.0.0
  flutter_markdown: ^0.7.7+1
  file_saver: ^0.3.1
  universal_html: ^2.3.0
  open_filex: ^4.5.0
  url_launcher: ^6.2.5
  flutter_svg: ^2.0.10
  country_flags: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#0A1929"
    theme_color: "#6366F1"
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A1929"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
