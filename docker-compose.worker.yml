services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DB_TYPE: mysql
      DISABLE_DEFAULT_ADMIN: 'true'
      DEBUG: 'false'
      JOB_REFUND_POLICY: delivered
    ports:
      - 127.0.0.1:8001:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in backend/.env}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
