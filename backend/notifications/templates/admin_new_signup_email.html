<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New signup pending approval</title>
    <style>
      body { font-family: Arial, sans-serif; background: #0b1220; color: #e5e7eb; margin: 0; padding: 0; }
      .container { max-width: 640px; margin: 0 auto; padding: 24px; }
      .card { background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      p { margin: 0 0 10px; color: rgba(229,231,235,0.9); }
      .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; color: rgba(229,231,235,0.75); }
      .btn { display: inline-block; background: #7c3aed; color: #fff !important; text-decoration: none; padding: 10px 14px; border-radius: 12px; font-weight: 700; }
      .footer { margin-top: 16px; font-size: 12px; color: rgba(229,231,235,0.6); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>New signup pending approval</h1>
        <p><strong>{{username}}</strong> just registered and is waiting for admin approval.</p>
        <p class="meta">Email: {{user_email}}<br/>Created: {{created_at}}</p>
        <p style="margin-top:14px;">
          <a class="btn" href="{{admin_url}}">Open admin dashboard</a>
        </p>
      </div>
      <div class="footer">© {{current_year}} Infinity Leads Pro</div>
    </div>
  </body>
</html>
