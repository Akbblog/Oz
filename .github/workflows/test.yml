name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CI-only throwaway signing key: the app refuses to start without one.
env:
  SECRET_KEY: ci-only-not-a-real-secret-0123456789
  DISABLE_DEFAULT_ADMIN: "true"

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: pytest (temporary SQLite)
        working-directory: ./backend
        run: python -m pytest tests -q

  # Production runs MariaDB 11.8. Locking, INSERT IGNORE, FOR UPDATE, rowcount
  # and isolation semantics differ from SQLite, so the suite runs against it too.
  # MySQL 8 is NOT in the matrix: a fresh MySQL 8 database cannot apply the
  # pre-existing migration 004 (index on a TEXT column, error 1170). Add
  # mysql:8.0 here once the MySQL migrations are fixed (see AUDIT_FIX_REPORT.md).
  backend-mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - image: mariadb:11.8
            env_prefix: MARIADB
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MARIADB_ROOT_PASSWORD: ci_root
          MYSQL_ROOT_PASSWORD: ci_root
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root || mariadb-admin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: pytest (${{ matrix.db.image }})
        working-directory: ./backend
        env:
          IL_TEST_MYSQL_URL: mysql://root:ci_root@127.0.0.1:3306/il_test_suite
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build web and verify bundle
        run: bash build_web.sh
